name: FPGA source and RTL
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CIRNET_CONTRACTS_DEV_WHEEL_URL: https://api.github.com/repos/cirnetlab/cirnet-contracts/releases/assets/712718400
  CIRNET_CONTRACTS_DEV_WHEEL_SHA256: 61009f539e672cd6bdd799c608d30273f2e6988ad429147b2efa8e3873d51c08
  CIRNET_CONTRACTS_WHEEL_URL: https://api.github.com/repos/cirnetlab/cirnet-contracts/releases/assets/712718253
  CIRNET_CONTRACTS_WHEEL_SHA256: 7b092af5817b0e15f02f9f5f292a8e1b20fe1d512600f9c0260d05a58ddaaf42
jobs:
  standalone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Bootstrap exact independent allocator before diagnostics
        env:
          CIRNET_ARTIFACTS_DIR: ${{ runner.temp }}/fpga-verification
          CIRNET_ARTIFACTS_TOKEN: ${{ secrets.CIRNET_ARTIFACTS_READ_TOKEN || secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python -B scripts/bootstrap_contract_tools.py
      - name: Select owned temporary paths
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          from scripts.artifact_paths import artifact_directory
          root=artifact_directory('fpga-leaf-ci')
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              for key in ('TEMP','TMP','TMPDIR','PIP_CACHE_DIR'):
                  output.write(f'{key}={root}\n')
              output.write(f'npm_config_cache={root / "npm-cache"}\n')
              output.write('PYTHONDONTWRITEBYTECODE=1\n')
          PY
      - name: Install complete hash-locked verification closure and selected Contracts
        env:
          CIRNET_ARTIFACTS_TOKEN: ${{ secrets.CIRNET_ARTIFACTS_READ_TOKEN || secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: |
          python -B -m pip download --require-hashes --only-binary=:all: --dest "$CIRNET_ARTIFACTS_SESSION/wheelhouse" -r requirements-verification.lock
          python -B -m pip install --no-index --find-links "$CIRNET_ARTIFACTS_SESSION/wheelhouse" --require-hashes --only-binary=:all: -r requirements-verification.lock
          python -B scripts/install_contracts.py
          python -B -m pip check
      - name: Install pinned official RTL toolchain
        run: python -B scripts/install_toolchain.py
      - name: Mandatory parser, both-top compilation and actual safety behavior
        # The RTL test executes check_rtl.py and requires both behavioral markers.
        run: python -B -m pytest -q --basetemp "$CIRNET_ARTIFACTS_SESSION/pytest" --junitxml "$CIRNET_ARTIFACTS_SESSION/results.xml"
      - name: Record toolchain and both RTL results from the tested execution
        run: cat "$CIRNET_ARTIFACTS_SESSION"/fpga-leaf-rtl-*/result.json
      - name: Build exact source artifact twice
        run: |
          python -B scripts/build_source.py --output "$CIRNET_ARTIFACTS_SESSION/cirnet-fpga-scaffold-0.1.2.tar.gz" --provenance integration/source-provenance.json
          python -B scripts/build_source.py --output "$CIRNET_ARTIFACTS_SESSION/rebuilt.tar.gz" --provenance integration/source-provenance.json
          cmp "$CIRNET_ARTIFACTS_SESSION/cirnet-fpga-scaffold-0.1.2.tar.gz" "$CIRNET_ARTIFACTS_SESSION/rebuilt.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always() && env.CIRNET_ARTIFACTS_SESSION != ''
        with:
          name: cirnet-fpga-v0.1.2
          path: ${{ env.CIRNET_ARTIFACTS_SESSION }}/cirnet-fpga-scaffold-0.1.2.tar.gz
      - name: Clean only this owned session
        if: always() && env.CIRNET_ARTIFACTS_SESSION != ''
        run: node "$CIRNET_ARTIFACTS_CLI" --cleanup "$CIRNET_ARTIFACTS_SESSION"
